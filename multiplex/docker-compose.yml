services:
  # Standalone, pre-integration test deployment for multiplex (nodriver/CDP-
  # direct sidecar, formerly "selenium-uc-v2" -- renamed since it never used
  # Selenium at all; "multiplex" names the actual hard-won mechanism this
  # needed, CDP session multiplexing over one shared connection, see
  # session_attach.py). Deliberately NOT part of docker-compose.yml/
  # docker-compose.postgres.yml (the actual production stack) -- Jake's
  # explicit ask was to stand this up and prove it separately until
  # integration is ready, without disrupting channelarr operations. This
  # file lets it run persistently (restart: unless-stopped) for extended
  # validation instead of ad-hoc `docker run` test containers that get torn
  # down after every check.
  #
  # Shares gluetun's network namespace by referencing the ALREADY-RUNNING
  # channelarr-vpn container by name (works across separate compose
  # projects -- network_mode: container:<name> is just a docker run flag
  # under the hood, not compose-project-scoped). Same VPN egress as
  # production and the v1 sidecar, deliberately -- real source testing needs
  # the same egress posture production uses.
  multiplex:
    build: .
    container_name: channelarr-multiplex
    network_mode: "container:channelarr-vpn"
    shm_size: 2g
    environment:
      - DISPLAY_NUM=93   # channelarr-selenium-uc (v1) already owns :99 in this shared netns
      - CHROME_PROFILE_DIR=/data/chrome-profile
      # Raised from the original conservative default of 3 to 8 after
      # direct concurrency-ceiling testing: 8-10 concurrent real captures
      # across distinct sources ran clean (10/10 succeeded, 13.2s total
      # wall-clock, CPU briefly touched ~93% of this host's 6-core ceiling
      # then dropped fast, memory recovered after) -- well-evidenced as
      # safe. 15 concurrent showed real sustained CPU pressure and a drop
      # in success rate, though confounded by known-flaky sources rather
      # than cleanly attributable to the concurrency level itself. Real
      # motivation: keeping a large volume of streams warm (fallback-chain
      # refresh, background revalidation) is exactly the "1000s of URLs
      # queued behind one slot" bottleneck this whole rebuild exists to
      # fix -- 8 concurrent slots is a genuine, substantial upgrade over
      # v1's single lock, not just a marginal bump.
      - SIDECAR_MAX_TABS=${SIDECAR_MAX_TABS:-8}
    volumes:
      - multiplex_profile:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;r=urllib.request.urlopen('http://localhost:4446/health',timeout=10);sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: syslog
      options:
        syslog-address: "${SYSLOG_ADDRESS:-tcp://localhost:1514}"
        tag: "channelarr-multiplex"

volumes:
  multiplex_profile:
